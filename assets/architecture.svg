<svg width="900" height="360" viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="900" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B0F14"/>
      <stop offset="1" stop-color="#111826"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3EB8AE"/>
    </marker>
  </defs>

  <rect width="900" height="360" rx="14" fill="url(#bg2)"/>
  <rect x="0.75" y="0.75" width="898.5" height="358.5" rx="13" fill="none" stroke="#26313F" stroke-width="1.5"/>

  <text x="30" y="38" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#EDEFF2">LaAeb &#8212; Insider Threat Detection Pipeline</text>
  <text x="30" y="58" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5C6773">CERT r4.2 dataset &#183; multi-signal anomaly fusion</text>

  <!-- CERT dataset node -->
  <rect x="30" y="150" width="150" height="60" rx="8" fill="#141C27" stroke="#2C3948" stroke-width="1.5"/>
  <text x="105" y="176" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="13" fill="#D9A253">CERT r4.2</text>
  <text x="105" y="194" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="11" fill="#8B96A5">insider threat dataset</text>

  <!-- AA / EA / BA nodes -->
  <rect x="270" y="80" width="170" height="52" rx="8" fill="#141C27" stroke="#2C3948" stroke-width="1.5"/>
  <text x="355" y="102" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="12" fill="#3EB8AE">Attention Anomaly</text>
  <text x="355" y="118" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="10" fill="#8B96A5">(AA)</text>

  <rect x="270" y="154" width="170" height="52" rx="8" fill="#141C27" stroke="#2C3948" stroke-width="1.5"/>
  <text x="355" y="176" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="12" fill="#3EB8AE">Emotion Anomaly</text>
  <text x="355" y="192" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="10" fill="#8B96A5">(EA) &#183; NLP / text embeddings</text>

  <rect x="270" y="228" width="170" height="52" rx="8" fill="#141C27" stroke="#2C3948" stroke-width="1.5"/>
  <text x="355" y="250" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="12" fill="#3EB8AE">Behavior Anomaly</text>
  <text x="355" y="266" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="10" fill="#8B96A5">(BA) &#183; session features</text>

  <!-- Fusion node -->
  <rect x="560" y="150" width="140" height="60" rx="8" fill="#161018" stroke="#3B2B44" stroke-width="1.5"/>
  <text x="630" y="176" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="13" fill="#D9A253">Fusion</text>
  <text x="630" y="194" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="10" fill="#8B96A5">Isolation Forest / XGBoost</text>

  <!-- Output node -->
  <rect x="750" y="150" width="120" height="60" rx="8" fill="#141C27" stroke="#2C3948" stroke-width="1.5"/>
  <text x="810" y="176" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="12" font-weight="600" fill="#EDEFF2">Insider</text>
  <text x="810" y="192" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="12" font-weight="600" fill="#EDEFF2">Threat Flag</text>

  <!-- edges: dataset -> AA/EA/BA -->
  <path d="M180,170 C220,170 220,106 270,106" fill="none" stroke="#2C3948" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M180,175 C220,175 220,180 270,180" fill="none" stroke="#2C3948" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M180,180 C220,180 220,254 270,254" fill="none" stroke="#2C3948" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- edges: AA/EA/BA -> fusion (animated flow) -->
  <path d="M440,106 C500,106 500,170 560,175" fill="none" stroke="#3EB8AE" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.4s" repeatCount="indefinite"/>
  </path>
  <path d="M440,180 C500,180 500,180 560,180" fill="none" stroke="#3EB8AE" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.4s" repeatCount="indefinite"/>
  </path>
  <path d="M440,254 C500,254 500,190 560,185" fill="none" stroke="#3EB8AE" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.4s" repeatCount="indefinite"/>
  </path>

  <!-- fusion -> output -->
  <path d="M700,180 L750,180" fill="none" stroke="#D9A253" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="450" y="330" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="11" fill="#5C6773">Implemented: GloVe embeddings &#183; feature engineering &#183; session construction &#183; Isolation Forest / XGBoost fusion</text>
</svg>
