<svg width="1000" height="230" viewBox="0 0 1000 230" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B0F14"/>
      <stop offset="1" stop-color="#111826"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D9A253"/>
      <stop offset="1" stop-color="#3EB8AE"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#1C2531" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1000" height="230" rx="14" fill="url(#bg)"/>
  <rect width="1000" height="230" rx="14" fill="url(#grid)" opacity="0.55"/>
  <rect x="0.75" y="0.75" width="998.5" height="228.5" rx="13" fill="none" stroke="#26313F" stroke-width="1.5"/>

  <rect x="0" y="0" width="6" height="230" fill="url(#accent)"/>

  <text x="56" y="76" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="600" fill="#EDEFF2">Muhammad Bilal</text>
  <text x="56" y="106" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#8B96A5">Enterprise Security Engineering &#8594; Applied Data Science &amp; AI Research</text>

  <!-- terminal prompt row -->
  <text x="56" y="152" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="20" fill="#3EB8AE">$</text>

<g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="20" fill="#D9A253">

  <text x="80" y="152" opacity="0">
    Cybersecurity Engineer
    <animate attributeName="opacity" dur="9s" repeatCount="indefinite"
      keyTimes="0;0.025;0.308;0.333;1"
      values="1;1;0;0;0"/>
  </text>

  <text x="80" y="152" opacity="0">
    Data Scientist
    <animate attributeName="opacity" dur="9s" repeatCount="indefinite"
      keyTimes="0;0.333;0.358;0.641;0.666;1"
      values="0;0;1;1;0;0"/>
  </text>

  <text x="80" y="152" opacity="0">
    AI &amp; Security Researcher
    <animate attributeName="opacity" dur="9s" repeatCount="indefinite"
      keyTimes="0;0.666;0.691;0.975;1"
      values="0;0;1;1;0"/>
  </text>

</g>

  <rect x="470" y="136" width="10" height="20" fill="#D9A253">
    <animate attributeName="opacity" dur="1s" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" repeatCount="indefinite"/>
  </rect>

  <text x="56" y="196" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5C6773">CyberArk PAM &#183; SIEM/SOAR &#183; EDR &#183; Vulnerability Management &#183; Machine Learning &#183; Anomaly Detection</text>
</svg>
